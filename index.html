<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coni-Mapas</title>
  <meta name="description" content="Generador de mapas de localización para investigación antártica: capas del IGN, bases antárticas argentinas, relieve, imágenes satelitales, zooms en lupa, paletas desde gráficos estadísticos y exportación para revistas científicas.">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Source+Sans+3:ital,wght@0,400;0,700;1,400;1,700&family=Source+Serif+4:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Roboto+Condensed:ital,wght@0,400;0,700;1,400;1,700&family=Open+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Lato:ital,wght@0,400;0,700;1,400;1,700&family=Merriweather:ital,wght@0,400;0,700;1,400;1,700&display=swap">
  <link rel="stylesheet" href="assets/ol.css">
  <link rel="stylesheet" href="assets/app.css?v=056fc3893a">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button type="button" class="icon panel-toggle" data-toggle-panel="left" aria-label="Mostrar u ocultar el panel de capas">☰</button>
      <div class="brand" aria-label="Coni-Mapas">
        <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><circle cx="11" cy="20" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2 1.6"/><line x1="13.4" y1="17.6" x2="17.6" y2="13.4" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2 1.6"/><circle cx="22" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M18.5 12.5c1.2-2.6 3-4.2 5.4-5.1-.6 1.3-.2 2.4 1 3.1-1.4.2-2.2 1.1-2.4 2.6-.9-.9-2.2-1.1-4-.6z" fill="#e8501c"/></svg>
        <span class="wordmark">Coni-Mapas</span>
      </div>
      <input id="title" class="title-input" type="text" aria-label="Título del proyecto" spellcheck="false">
      <div class="topbar-tools">
        <label class="tb-field"><span>Proyección</span><select id="projection" aria-label="Proyección del mapa"></select></label>
        <div class="tb-group" role="group" aria-label="Historial">
          <button type="button" id="btn-undo" class="icon" title="Deshacer (Ctrl+Z)" aria-label="Deshacer">↶</button>
          <button type="button" id="btn-redo" class="icon" title="Rehacer (Ctrl+Mayús+Z)" aria-label="Rehacer">↷</button>
        </div>
        <div class="menu-wrap">
          <button type="button" id="btn-project" class="btn ghost" aria-haspopup="true" aria-expanded="false">Proyecto</button>
          <div id="project-menu" class="menu" role="menu" hidden>
            <button type="button" role="menuitem" data-act="save">Guardar proyecto (.json)</button>
            <button type="button" role="menuitem" data-act="open">Abrir proyecto…</button>
            <hr>
            <button type="button" role="menuitem" data-act="sites-csv">Descargar sitios (CSV)</button>
            <button type="button" role="menuitem" data-act="sites-geojson">Descargar sitios (GeoJSON)</button>
            <hr>
            <span class="menu-label">Empezar desde una plantilla</span>
            <button type="button" role="menuitem" data-tpl="coni">Coni: pingüinos</button>
            <button type="button" role="menuitem" data-tpl="modelo1">Modelo 1: satelital con lupa</button>
            <button type="button" role="menuitem" data-tpl="modelo2">Modelo 2: vectorial bicontinental</button>
            <button type="button" role="menuitem" data-tpl="blanco">Proyecto en blanco</button>
          </div>
          <input type="file" id="open-project" accept=".json,application/json" hidden>
        </div>
        <button type="button" id="btn-export" class="btn primary">Exportar figura</button>
      </div>
    </header>

    <aside class="panel left" id="left" aria-label="Capas, sitios y figura">
      <nav class="tabs" role="tablist">
        <button type="button" class="tab" role="tab" data-tab="capas" aria-selected="true">Capas</button>
        <button type="button" class="tab" role="tab" data-tab="sitios" aria-selected="false">Sitios y colores</button>
        <button type="button" class="tab" role="tab" data-tab="figura" aria-selected="false">Figura</button>
      </nav>
      <div class="panel-body" id="left-body"></div>
    </aside>

    <main class="stage" id="stage">
      <div class="pasteboard" id="pasteboard">
        <div class="paper" id="paper">
          <div id="map-main" class="map-main"></div>
          <canvas id="overlay" class="overlay" aria-hidden="true"></canvas>
        </div>
      </div>
      <footer class="statusbar" id="statusbar">
        <span class="st-cell coord" data-k="coord"></span>
        <span class="st-cell"><span class="st-k">Escala</span> <span data-k="scale">—</span></span>
        <span class="st-cell" data-k="proj"></span>
        <span class="st-cell" data-k="size"></span>
        <span class="st-cell load" data-k="load" aria-live="polite"></span>
        <span class="st-zoom" role="group" aria-label="Zoom de la vista previa">
          <button type="button" class="icon" data-zoom="out" aria-label="Alejar la vista previa">−</button>
          <button type="button" class="btn small ghost" data-zoom="fit">Ajustar</button>
          <button type="button" class="icon" data-zoom="in" aria-label="Acercar la vista previa">+</button>
        </span>
      </footer>
    </main>

    <aside class="panel right" id="inspector" aria-label="Edición del elemento seleccionado">
      <div class="panel-body" id="inspector-body"></div>
    </aside>
  </div>

  <dialog id="export-dialog" aria-labelledby="export-title">
    <form method="dialog" class="dlg">
      <h2 id="export-title">Exportar figura</h2>
      <div class="dlg-body"></div>
    </form>
  </dialog>

  <div id="toast" class="toast" aria-live="polite"></div>
  <script src="assets/app.js?v=056fc3893a"></script>
</body>
</html>
